/* One place decides how a listing's photo is drawn: user photo (a/p), an upload from the sell form,
   or the drawn stand-in. Cards use the small 400px version of user photos. */
function photoHtml(p, i, small){
  const ph = p.ph[i || 0] || p.ph[0];
  if (!ph) return '';
  if (ph.none) return '<span class="ph-empty">' + glyph(CATS.find(c => c.id === p.cat).glyph) + '</span>';
  if (ph.u) return '<img src="' + ph.u + '" alt="" decoding="async">';
  if (ph.s) return '<img src="a/p/' + ph.s + (small && (ph.k === 'front' || ph.k === 'back') ? '-s' : '') + '.webp" alt="" loading="lazy" decoding="async" width="' + (small ? 400 : 720) + '" height="' + (small ? 500 : 900) + '">';
  return ART.photo(p.art, ph.a, { brand:p.brand, size:p.sizes ? 'M' : p.size, dtype:p.dtype });
}
const photoKind = ph => t('photo.' + ph.k);
function soldState(p){
  if (p.paused) return 'paused';
  if (available(p)) return '';
  const o = S.orders.concat(S.sorders).find(x => x.lid === p.id && (x.status === 'pending' || x.status === 'accept'));

/* ============================== BROWSE ============================== */
function searchable(p){
  const c = CATS.find(x => x.id === p.cat);
  return [p.t.th, p.t.en, p.brand, DICT.cat[c.id][0], DICT.cat[c.id][1], GEN.cat[p.sub].th, GEN.cat[p.sub].en, DICT.style[p.style][0], DICT.style[p.style][1]]
    .concat(p.colors.flatMap(k => DICT.color[k])).join(' ').toLowerCase();
}
const brandKey = p => p.brand || '—';
function base(){ return S.f.feed === 'featured' ? liveAds().map(a => a.p) : liveListings(); }
function applyFilters(list, skip){
  const f = S.f; let a = list;
  const q = f.q.trim().toLowerCase();
  if (q) a = a.filter(p => q.split(/\s+/).every(w => searchable(p).includes(w)));
  if (f.cat && skip !== 'cat') a = a.filter(p => p.cat === f.cat && (!f.sub || p.sub === f.sub));
  if (f.sizes.length && skip !== 'sizes') a = a.filter(p => p.sizes ? p.sizes.some(x => x.stock > 0 && f.sizes.includes(x.size)) : f.sizes.includes(p.size));
  if (f.conds.length && skip !== 'conds') a = a.filter(p => f.conds.includes(p.cond));
  if (f.colors.length && skip !== 'colors') a = a.filter(p => p.colors.some(c => f.colors.includes(c)));
  if (f.brands.length && skip !== 'brands') a = a.filter(p => f.brands.includes(brandKey(p)));
  if (f.styles.length && skip !== 'styles') a = a.filter(p => f.styles.includes(p.style));
  if (f.min !== '') a = a.filter(p => unitPrice(p) >= +f.min);
  if (f.max !== '') a = a.filter(p => unitPrice(p) <= +f.max);
  if (f.multi) a = a.filter(p => p.sizes);
  return a;
}
function filtered(){
  const a = applyFilters(base()).slice();
  if (S.f.sort === 'asc') a.sort((x, y) => unitPrice(x) - unitPrice(y));
  else if (S.f.sort === 'desc') a.sort((x, y) => unitPrice(y) - unitPrice(x));
  else if (S.f.feed !== 'featured') a.sort(byNewest);
  return a;
}
const catById = id => CATS.find(c => c.id === id);
function activeFilters(){
  const f = S.f, out = [];
  if (f.cat) out.push({ k:'cat', v:'', label: f.sub ? subName(f.sub) : catLabel(f.cat) });
  f.sizes.forEach(s => out.push({ k:'sizes', v:s, label: t('browse.size') + ' ' + sizeLabel(s) }));
  f.conds.forEach(c => out.push({ k:'conds', v:c, label: condLabel(c) }));
  if (f.min !== '' || f.max !== '') out.push({ k:'price', v:'', label: (f.min !== '' ? '฿' + f.min : '฿0') + ' – ' + (f.max !== '' ? '฿' + f.max : '∞') });
  f.colors.forEach(c => out.push({ k:'colors', v:c, label: t('color.' + c) }));
  f.brands.forEach(b => out.push({ k:'brands', v:b, label: b === '—' ? t('common.noBrand') : b }));
  f.styles.forEach(s => out.push({ k:'styles', v:s, label: t('style.' + s) }));
  if (f.multi) out.push({ k:'multi', v:'', label: t('browse.multiSize') });
  return out;
}
const sortLabel = () => t(S.f.sort === 'asc' ? 'browse.sortAsc' : S.f.sort === 'desc' ? 'browse.sortDesc' : 'browse.sortTime');
function fbBtn(id, label, n){

function chipCheck(k, v, label, checked, extra){ return '<button class="chip' + (extra || '') + '" role="checkbox" aria-checked="' + checked + '" data-act="togF" data-k="' + k + '" data-v="' + esc(v) + '">' + label + '</button>'; }
function countBy(key){ const m = {}; applyFilters(base(), key).forEach(p => { (key === 'colors' ? p.colors : key === 'brands' ? [brandKey(p)] : key === 'sizes' ? (p.sizes ? p.sizes.filter(x => x.stock > 0).map(x => x.size) : [p.size]) : [p[key === 'conds' ? 'cond' : key === 'styles' ? 'style' : key]]).forEach(v => { m[v] = (m[v] || 0) + 1; }); }); return m; }

function colorChips(){ const f = S.f, n = countBy('colors'); return '<div class="swatches" role="group" aria-label="' + t('browse.color') + '">' + Object.keys(COLORS).map(c => '<button class="sw' + (n[c] ? '' : ' dim') + '" role="checkbox" aria-checked="' + f.colors.includes(c) + '" data-act="togF" data-k="colors" data-v="' + c + '"><span class="sw-dot" style="' + ART.swatch(COLORS[c]) + '"></span><span class="sw-l">' + t('color.' + c) + '</span></button>').join('') + '</div>'; }
function brandOptions(){

function condOptions(){ const f = S.f, n = countBy('conds'); return CONDS.map(c => optCheck('conds', c, condLabel(c) + ' <span class="opt-n">' + (n[c] || 0) + '</span>', f.conds.includes(c), t('cond.' + c + 'D'))).join(''); }

function measVal(k, v){
  if (k === 'insole') return v + ' ' + t('meas.cm');
  return S.units === 'cm' ? (Math.round(v * 2.54 * 10) / 10) + ' ' + t('meas.cm') : v + '″';
}

  if (!keys.length) return h + '<p class="muted" style="font-size:14px">' + t('meas.none') + '</p></section>';
  const letters = 'ABCD';
  h += '<div class="meas"><div class="meas-fig">' + ART.measure(kind) + '</div><dl class="meas-list">' +
    MEAS[kind].map((k, i) => m[k] == null ? '' : '<div><dt><span class="ml" aria-hidden="true">' + letters[i] + '</span>' + t('meas.' + k) + '</dt><dd class="num">' + measVal(k, m[k]) + '</dd></div>').join('') + '</dl></div>' +
    '<p class="meas-tip">' + ic('ruler', 'i-sm') + '<span>' + (kind === 'shoe' ? t('guide.m4d').replace(/<[^>]+>/g, '') : t('meas.sub') + (S.lang === 'th' ? ' ' : '. ') + t('meas.tip')) + ' <a class="btn-link" href="#help.measure" data-go="help.measure">' + t('meas.howTo') + '</a></span></p></section>';
  return h;
}

/* ============================== ORDERS (buyer) ============================== */
const OTABS = [
  { id:'wait', l:'orders.tabWait', f: o => o.status === 'pending' },
  { id:'pickup', l:'orders.tabPickup', f: o => o.status === 'accept' && !isOverdue(o) },

  { id:'done', l:'orders.tabDone', f: o => o.status === 'done' },
  { id:'cancel', l:'orders.tabCancel', f: o => o.status === 'canceled' || o.status === 'rejected' },

function buyerActions(o, detail){

  if (o.status === 'pending') h += '<button class="btn btn-secondary btn-sm" data-act="dialog" data-v="cancel" data-id="' + o.id + '">' + t('orders.btnCancel') + '</button>';
  else if (isOverdue(o)) h += '<button class="btn btn-danger btn-sm" data-act="dialog" data-v="notReceived" data-id="' + o.id + '">' + t('orders.btnNotReceived') + '</button>';
  else if (o.status === 'accept') h += '<a class="btn btn-primary btn-sm" href="#scan.' + o.id + '" data-go="scan.' + o.id + '">' + ic('scan-qr-code', 'i-sm') + t('orders.btnScan') + '</a>';

  if (!detail) h += '<a class="btn btn-ghost btn-sm" href="#orders.' + o.id + '" data-go="orders.' + o.id + '">' + t('orders.details') + ic('chevron-right', 'i-sm') + '</a>';

}
function ocard(o){

function fakeQR(seed, size){
  size = size || 25; let x = 0; for (let i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  const inF = (r, c) => { const f = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7; return f(0, 0) || f(0, size - 7) || f(size - 7, 0); };
  let d = '';
  const finder = (r0, c0) => { d += 'M' + c0 + ' ' + r0 + 'h7v7h-7zM' + (c0 + 1) + ' ' + (r0 + 1) + 'v5h5v-5z' + 'M' + (c0 + 2) + ' ' + (r0 + 2) + 'h3v3h-3z'; };
  finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) { if (inF(r, c) || (r < 8 && c < 8) || (r < 8 && c > size - 9) || (r > size - 9 && c < 8)) continue; if (rnd() > .52) d += 'M' + c + ' ' + r + 'h1v1h-1z'; }
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR"><path fill="#0B1119" fill-rule="evenodd" d="' + d + '"/></svg>';
}

  nChat(el){ S.nChat = !S.nChat; toast(t(S.nChat ? 'settings.on' : 'settings.off')); render(); refocusEl(el); },
  showFac(el){ S.sellers.me.showFac = !S.sellers.me.showFac; toast(t('settings.saved')); render(); refocusEl(el); },
};
function finishScan(id){
  const o = S.orders.find(x => x.id === id); if (!o) return;
  o.status = 'done'; o.doneAt = new Date(); addNotif({ kind:'completed', order:o.id });
  S.scan.step = 3; toast(t('scan.doneT')); render(); focusMain();
}

/* ============================== forms ============================== */
const FORMS = {
  search(f){ const q = f.querySelector('input[name="q"]').value.trim(); S.f = Object.assign(defaultFilters(), { q }); go('browse.search', { top:true }); const i = document.getElementById('q'); if (i && isMobile()) i.blur(); },
  helpq(){},
  uid(f){ const id = f.dataset.id, v = f.querySelector('#uid').value.trim().toUpperCase(); if (v && v === (UIDS[id] || '4F9K27')) { S.ui.clearKeep = true; finishScan(id); } else { S.scan.err = true; render(); const i = document.getElementById('uid'); if (i) i.focus(); } },
  chat(f){
    const i = f.querySelector('#chat-input'), v = i.value.trim(); if (!v) return;
    const r = S.rooms.find(x => x.id === S.chat.room); r.msgs.push({ me:true, t:{ th:v, en:v }, at:new Date() });
    i.value = ''; S.ui.clearKeep = true; render(); const ni = document.getElementById('chat-input'); if (ni) ni.focus();
    if (r.kind !== 'buyer') setTimeout(() => { const k = r.kind === 'admin' ? 'auto' : 'autoSeller'; r.msgs.push({ me:false, t:{ th:DICT.chat[k][0], en:DICT.chat[k][1] }, at:new Date() }); if (!(S.chat.open && S.chat.room === r.id)) r.unread++; render(); }, 1400);
  },
  sell(f){
    const sf = S.sellForm, fd = new FormData(f), e = {};
    const title = (fd.get('title') || '').trim(), price = +fd.get('price'), times = fd.getAll('times'), locs = fd.getAll('locs');
    const multi = sf.multi && sf.cat !== 'shoes', sizes = multi ? SIZES.filter(s => +(sf.qty[s] || 0) > 0) : [];
    if (!sf.photos.front) e.photo = 'errPhoto';
    if (!title) e.title = 'errTitle';
    if (multi ? !sizes.length : !sf.size) e.size = 'errSize';
    if (!sf.cond) e.cond = 'errCond';
    if (sf.defect === 'has' && !(fd.get('defect') || '').trim()) e.defect = 'errDefect';
    if (!(price > 0)) e.price = 'errPrice';
    if (!times.length || !locs.length) e.slots = 'errSlots';
    sf.err = e;
    if (Object.keys(e).length) { render(); const first = document.querySelector('[aria-invalid="true"]') || document.querySelector('[data-need="1"]') || document.querySelector('.note-err'); if (first) { first.scrollIntoView({ block:'center' }); const tgt = first.matches('input,button,select,textarea') ? first : first.querySelector('button:not([disabled]),input'); if (tgt) tgt.focus({ preventScroll:true }); } return; }
    const kind = sfKind(sf), m = {};
    MEAS[kind].forEach(k => { const v = +(fd.get('m-' + k) || 0); if (v > 0) m[k] = v; });
    const id = 'n' + String(S.nextListing++).padStart(2, '0');
    const ph = PHOTO_SLOTS.filter(k => sf.photos[k]).map(k => Object.assign({ k }, sf.photos[k]));
    const defect = sf.defect === 'has' ? String(fd.get('defect')).trim() : '';
    const desc = (fd.get('desc') || '').trim();
    S.listings.unshift({ id, public_uid:id, seller:'me', cat:sf.cat, sub:sf.sub, t:{ th:title, en:title }, price, size: multi ? sizes[0] : sf.size, cond:sf.cond, colors: sf.colors.length ? sf.colors.slice() : ['multi'], style: sf.style || 'casual', brand:(fd.get('brand') || '').trim(), m,
      defect: defect ? { th:defect, en:defect } : null, dtype:'stain', ph, art: sf.art ? Object.assign({}, sf.art) : (ph.some(x => x.a) ? SAMPLE_ART[sf.cat] : null), desc: desc ? { th:desc, en:desc } : null, listed:new Date(), promo:null,
      stock: multi ? sizes.reduce((n, s) => n + +sf.qty[s], 0) : 1, sizes: multi ? sizes.map(s => ({ id:s.toLowerCase(), size:s, stock:+sf.qty[s], m:null })) : null, times, locs });
    S.sellForm = null; S.ui.clearKeep = true; go('item.' + id); toast(t('sell.done', { title }));
  },
  apply(f){ if (!f.reportValidity()) return; S.sellerReq = { status:'pending', at:new Date() }; S.ui.clearKeep = true; render(); window.scrollTo(0, 0); focusMain(); toast(t('apply.pendingT')); },
};

/* ---- 14-events.js ---- */
/* ============================== events ============================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go]');
  const inMenu = e.target.closest('[data-menu-root]');
  if (S.ui.menu && !inMenu && !(el && el.dataset.act === 'menu')) { S.ui.menu = null; if (!el) { render(); return; } }
  if (!el) return;
  if (el.getAttribute('aria-disabled') === 'true' && el.tagName === 'A') { e.preventDefault(); return; }
  if (el.dataset.act) {
    if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'file')) { if (el.type === 'checkbox') A[el.dataset.act](el, e); return; }
    if (el.tagName === 'SELECT') return;
    e.preventDefault();
    const fn = A[el.dataset.act]; if (fn) fn(el, e); else console.warn('no action', el.dataset.act);
    return;
  }
  if (el.dataset.go !== undefined) {
    e.preventDefault();
    if (!el.dataset.go) return;
    if (el.dataset.scroll && S.route.name === 'settings') { S.route = parse(el.dataset.go); try { history.replaceState(null, '', '#' + el.dataset.go); } catch(err){} render(); const s = document.getElementById(el.dataset.scroll); if (s) { s.scrollIntoView({ block:'start' }); const h = s.querySelector('h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll:true }); } } return; }
    if (S.chat.open && isMobile()) S.chat = { open:false, room:null };
    go(el.dataset.go);
  }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if (act === 'sellPhoto') { const f = el.files && el.files[0]; if (!f || !/^image\//.test(f.type)) return; S.sellForm.photos[el.dataset.k] = { u:URL.createObjectURL(f) }; delete S.sellForm.err.photo; render(); const n = document.querySelector('.pslot [data-act="sellPhotoDel"][data-k="' + el.dataset.k + '"]'); if (n) n.focus(); return; }
  if (act === 'sfSub') { S.sellForm.sub = el.value; render(); const s = document.getElementById('s-sub'); if (s) s.focus(); return; }
  if (act === 'pmListing') { S.ui.dialog.pid = el.value; render(); const s = document.getElementById('pm-p'); if (s) s.focus(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'helpq') { S.helpQ = el.value; patch('help-body', vHelpBody()); }
  else if (el.id === 'clq') { S.closetLQ = el.value; const sec = document.getElementById('cl-list'); if (sec) { const tmp = document.createElement('div'); tmp.innerHTML = cListings(); const n = tmp.querySelector('#cl-list'); if (n) sec.innerHTML = n.innerHTML; } }
  else if (el.dataset.act === 'sfQty') { S.sellForm.qty[el.dataset.k] = el.value; patch('sell-preview', vSellPreview()); }
  else if (el.dataset.live === 'preview') { patch('sell-preview', vSellPreview()); if (el.id === 's-price') { const n = document.getElementById('s-net'); const v = +el.value || 0; if (n) n.textContent = money(r2(v)); } }
  else if (el.dataset.live === 'dc') { const p = findL(S.ui.dialog.id); const a = document.getElementById('dc-after'); if (a && p) a.textContent = money(r2(p.price * (1 - (+el.value || 0) / 100))); }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.ui.dialog || S.ui.sheet) { e.preventDefault(); closeDialog(); return; }
    if (S.ui.menu) { A.closeMenu(); return; }
    if (S.chat.open) { A.chatClose(); return; }
    if (S.nav && !isWide()) { A.sb(); return; }
  }
  if (e.key === 'Tab') {
    const box = document.getElementById('dlg') || document.getElementById('sheet') || (S.nav && !isWide() && !isMobile() ? document.getElementById('sidebar') : null);
    if (box) { const f = [...box.querySelectorAll('button:not([disabled]),a[href],input:not([type=hidden]):not(.sr-only),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); } else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  if (['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) {
    const grp = e.target.closest('[role="radiogroup"],[role="tablist"]');
    if (grp && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
      const items = [...grp.querySelectorAll('[role="radio"]:not([disabled]),[role="tab"]')]; const i = items.indexOf(e.target);
      if (i >= 0) { e.preventDefault(); const n = items[(i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; n.click(); const same = document.querySelector(selOf(n)); if (same) same.focus(); return; }
    }
    if (S.route.name === 'item' && e.target.closest('.g-main') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const b = document.querySelector('.g-nav.' + (e.key === 'ArrowRight' ? 'next' : 'prev')); if (b) { e.preventDefault(); b.click(); } }
  }
  if (S.ui.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('.menu')) {
    const items = [...e.target.closest('.menu').querySelectorAll('.menu-item,.opt,.notif-item,.chip,.sw')]; const i = items.indexOf(e.target.closest('.menu-item,.opt,.notif-item,.chip,.sw')); if (i < 0) return; e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});
/* swipe between photos on touch screens */
let swipeX = null;
document.addEventListener('touchstart', e => { swipeX = e.target.closest('[data-swipe]') ? e.touches[0].clientX : null; }, { passive:true });
document.addEventListener('touchend', e => { if (swipeX == null) return; const dx = e.changedTouches[0].clientX - swipeX; swipeX = null; if (Math.abs(dx) < 40) return; const b = document.querySelector('.g-nav.' + (dx < 0 ? 'next' : 'prev')); if (b) b.click(); }, { passive:true });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

/* ============================== boot ============================== */
applyTheme();
S.nav = S.navStyle === 'drawer' && isWide() && !isMobile() && LS.get('navDock', false);
matchMedia('(min-width: 1280px)').addEventListener('change', e => { S.nav = S.navStyle === 'drawer' && e.matches && LS.get('navDock', false); render(); });
S.route = parse(location.hash);
enter(S.route);
render();

})();
</script>
