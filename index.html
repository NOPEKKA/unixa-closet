<title>UNIXA Closet</title>
<meta name="description" content="Clickable prototype of UNIXA as a student-to-student clothing marketplace.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F1F3F6;--surface-3:#E6E9EE;
  --border:#E2E5EA;--border-strong:#C9CFD8;
  --text:#121826;--muted:#4A5362;--subtle:#687281;--ink:#121826;
  --primary:#0056A9;--primary-hover:#00468B;--primary-soft:#E8F0FA;--primary-ink:#0A4C92;--on-primary:#FFFFFF;
  --success:#18794E;--success-soft:#E3F3EA;
  --warning:#8A5300;--warning-soft:#FBEFD9;
  --danger:#C22F30;--danger-soft:#FBE9E9;
  --sale:#C22F30;--star:#B7791F;
  --photo-bg:#EEF0F3;
  --focus:#2E7AD6;
  --overlay:rgba(12,18,30,.46);
  --shadow-pop:0 12px 32px rgba(18,24,38,.14),0 2px 6px rgba(18,24,38,.08);
  --shadow-soft:0 1px 3px rgba(18,24,38,.14);
  --inverse:#161C28;--on-inverse:#F3F5F8;
  --logo-filter:none;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
  --sb-w:248px;--sb-w-c:80px;--top-h:64px;--bn-h:64px;
  --font-display:"Anuphan","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1116;--surface:#161A21;--surface-2:#1C212A;--surface-3:#252B35;
    --border:#272D37;--border-strong:#39414E;
    --text:#E8ECF2;--muted:#A9B2C0;--subtle:#8590A0;--ink:#F2F4F7;
    --primary:#6AA8F0;--primary-hover:#88BAF4;--primary-soft:rgba(106,168,240,.14);--primary-ink:#9DC8F8;--on-primary:#06182C;
    --success:#55C58E;--success-soft:rgba(85,197,142,.14);
    --warning:#E9B45E;--warning-soft:rgba(233,180,94,.14);
    --danger:#F08A8A;--danger-soft:rgba(240,138,138,.14);
    --sale:#F08A8A;--star:#E9B44C;
    --photo-bg:#1F242D;
    --focus:#88BAF4;
    --overlay:rgba(0,0,0,.62);
    --shadow-pop:0 14px 36px rgba(0,0,0,.5),0 0 0 1px #272D37;
    --shadow-soft:0 1px 3px rgba(0,0,0,.5);
    --inverse:#E8ECF2;--on-inverse:#0E1116;
    --logo-filter:brightness(0) invert(1);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1116;--surface:#161A21;--surface-2:#1C212A;--surface-3:#252B35;
  --border:#272D37;--border-strong:#39414E;
  --text:#E8ECF2;--muted:#A9B2C0;--subtle:#8590A0;--ink:#F2F4F7;
  --primary:#6AA8F0;--primary-hover:#88BAF4;--primary-soft:rgba(106,168,240,.14);--primary-ink:#9DC8F8;--on-primary:#06182C;
  --success:#55C58E;--success-soft:rgba(85,197,142,.14);
  --warning:#E9B45E;--warning-soft:rgba(233,180,94,.14);
  --danger:#F08A8A;--danger-soft:rgba(240,138,138,.14);
  --sale:#F08A8A;--star:#E9B44C;
  --photo-bg:#1F242D;
  --focus:#88BAF4;
  --overlay:rgba(0,0,0,.62);
  --shadow-pop:0 14px 36px rgba(0,0,0,.5),0 0 0 1px #272D37;
  --shadow-soft:0 1px 3px rgba(0,0,0,.5);
  --inverse:#E8ECF2;--on-inverse:#0E1116;
  --logo-filter:brightness(0) invert(1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.3;margin:0;text-wrap:pretty;letter-spacing:-.005em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
ul,ol{margin:0;padding:0;list-style:none}
dl,dd{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.92em;letter-spacing:.01em}
.muted{color:var(--muted)}
.subtle{color:var(--subtle)}
.rail,.cats,.tabs,.tbl-wrap,.opt-list,.notif-list,.chat-rooms,.msgs,.lcard,.g-thumbs{position:relative}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.i-sm{width:16px;height:16px}
.i-xs{width:14px;height:14px}
.i-lg{width:24px;height:24px}
.i-fill{fill:currentColor;stroke:none}
.i.star,.star .i{color:var(--star)}
.only-mob{display:none}
@media (max-width:767px){.only-desk{display:none}.only-mob{display:block}}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--inverse);color:var(--on-inverse);padding:10px 14px;border-radius:var(--r-sm);font-weight:600}
.skip:focus{top:12px}
.linkish{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-size:inherit}
.linkish:hover{color:var(--primary)}

/* ---------- shell ---------- */
.shell{min-height:100%;display:flex}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(272px,calc(100vw - 56px));background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:80;visibility:hidden;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px)}
.nav-open .sidebar{visibility:visible;transform:none;box-shadow:var(--shadow-pop)}
.sidebar.anim{animation:navin .2s ease-out}
@keyframes navin{from{transform:translateX(-100%)}to{transform:none}}
.nav-scrim{position:fixed;inset:0;background:var(--overlay);z-index:79;animation:fade .15s ease-out}
@media (min-width:1280px){.nav-open .sidebar{position:sticky;height:100vh;height:100dvh;box-shadow:none;z-index:30}.nav-scrim{display:none}.nav-open .tb-logo{display:none}.nav-open .sb-toggle{display:none}.sidebar.anim{animation:none}}
.sb-head{height:var(--top-h);display:flex;align-items:center;gap:8px;padding:0 12px 0 18px;border-bottom:1px solid var(--border);flex:none}
.sb-logo{display:flex;align-items:center;gap:10px;min-width:0}
.sb-logo img{height:30px;width:auto;filter:var(--logo-filter)}
.sb-word{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.06em}
.sb-toggle{margin-left:auto}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);padding:14px 12px 6px}
.sb-link{display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:14.5px;position:relative}
.sb-link:hover{background:var(--surface-2);color:var(--text)}
.sb-link[aria-current="page"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.sb-link .count{margin-left:auto}
.sb-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.sb-cta{margin:8px 2px 4px;padding:14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.sb-cta p{font-size:13px;color:var(--muted);line-height:1.5}
.sb-cta p b{color:var(--text)}
.demo-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--border-strong);background:transparent;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--muted);font-size:13px;text-align:left}
.demo-btn:hover{color:var(--text);border-color:var(--muted)}
.demo-btn b{color:var(--text);font-weight:600}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 24px;max-width:1360px;margin:0 auto}
.nav-btn{margin-left:-8px}
.tb-logo{display:flex;align-items:center;gap:8px;flex:none}
.tb-logo img{height:26px;width:auto;filter:var(--logo-filter)}
.search{flex:1;max-width:620px;margin:0 auto;position:relative;transition:opacity .15s}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
.search input{width:100%;height:42px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-pill);padding:0 44px 0 42px;font-size:14.5px}
.search input::placeholder{color:var(--subtle)}
.search input:focus{outline:none;border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.search .search-go{position:absolute;right:4px;top:4px;height:34px;width:34px;border-radius:var(--r-pill);border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer}
.search .search-go .i{position:static;transform:none;color:inherit}
.topbar.hide-search .search{visibility:hidden;opacity:0}
.tb-actions{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 6px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--primary-soft);color:var(--primary-ink);flex:none;font-family:var(--font-display)}
.avatar.sm{width:24px;height:24px;font-size:11px}
.avatar.lg{width:48px;height:48px;font-size:18px}
.avatar.xl{width:72px;height:72px;font-size:26px}
.avatar.neutral{background:var(--surface-3);color:var(--muted)}
.me-btn{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:var(--r-pill);border:1px solid transparent;background:none;cursor:pointer}
.me-btn:hover{background:var(--surface-2)}
.me-btn .me-name{font-size:13.5px;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.content{width:100%;max-width:1360px;margin:0 auto;padding:24px 24px 48px;container-type:inline-size;container-name:content;flex:1}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:26px}
.page-h p{color:var(--muted);margin-top:2px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--subtle);margin-bottom:14px}
.crumbs a:hover{color:var(--primary)}

.footer{border-top:1px solid var(--border);background:var(--surface)}
.footer-in{max-width:1360px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;color:var(--muted)}
.footer-in a:hover{color:var(--primary)}
.footer-in .f-brand{font-weight:600;color:var(--text);margin-right:auto}

.bottomnav{display:none}
.chat-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:52px;height:52px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,50,110,.24)}
.icon-btn.mob-chat{display:none}
.chat-fab:hover{background:var(--primary-hover)}
.chat-fab .count{position:absolute;top:-2px;right:-2px;border:2px solid var(--bg)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1;transition:background-color .12s,border-color .12s,color .12s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--surface);border-color:var(--border-strong);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-link{background:none;border:0;padding:0;height:auto;color:var(--primary);font-weight:600;cursor:pointer}
.btn-link:hover{text-decoration:underline}
.btn-sm{height:32px;padding:0 12px;font-size:13.5px}
.btn-lg{height:48px;padding:0 22px;font-size:15.5px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"],.btn.is-disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);cursor:pointer;position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .count{position:absolute;top:3px;right:1px}
.icon-btn.sm{width:32px;height:32px}
.count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);font-size:11px;font-weight:700;line-height:1;background:var(--primary);color:var(--on-primary);font-variant-numeric:tabular-nums}
.count.attn{background:var(--danger);color:#fff}
.count.soft{background:var(--surface-3);color:var(--muted)}
.lang-btn{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12.5px;letter-spacing:.04em;width:auto;padding:0 10px}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"],.chip[aria-checked="true"],.chip.ck:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip .sub{font-size:12px;color:var(--subtle);font-weight:500}
.chip[aria-pressed="true"] .sub,.chip[aria-checked="true"] .sub{color:inherit;opacity:.8}
.chip.sm{min-height:32px;padding:4px 12px;font-size:13.5px}
.chip.dim{color:var(--subtle)}
.chip.ck input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.chip-x{min-height:30px;padding:3px 6px 3px 12px;font-size:13px;background:var(--surface-2);border-color:var(--border)}
.chip-x .i{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.4}
.st .i{width:14px;height:14px;stroke-width:2}
.st-info{background:var(--primary-soft);color:var(--primary-ink)}
.st-success{background:var(--success-soft);color:var(--success)}
.st-warning{background:var(--warning-soft);color:var(--warning)}
.st-danger{background:var(--danger-soft);color:var(--danger)}
.st-neutral{background:var(--surface-3);color:var(--muted)}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--success);white-space:nowrap}
.vbadge .i{width:16px;height:16px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl,.lbl{font-size:13.5px;font-weight:600;color:var(--text)}
.lbl{display:block;margin-bottom:6px}
.field .hint{font-size:12.5px;color:var(--subtle)}
.input,.select,.textarea{width:100%;height:42px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;font-size:14.5px}
.select.sm,.input.sm{height:34px;font-size:13.5px}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;display:flex;gap:6px;align-items:flex-start}
.err .i{width:16px;height:16px;margin-top:3px}
.input-affix{position:relative}
.input-affix .affix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--subtle);font-size:14px}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.spacer{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14.5px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border);gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:6px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-soft)}
.seg.sm button{height:26px;padding:0 10px;font-size:12.5px}
.switch{position:relative;width:44px;height:26px;border-radius:var(--r-pill);border:0;background:var(--border-strong);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;padding:10px 12px 11px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;cursor:pointer;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"],.tab[aria-current="page"]{color:var(--primary-ink);border-bottom-color:var(--primary)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.card-pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h2,.card-h h3{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:4px 0}
.kv span:first-child{color:var(--muted)}
.kv.total{font-weight:700;font-size:16px;padding-top:10px;margin-top:6px;border-top:1px solid var(--border)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.55;flex-wrap:wrap}
.note>span{flex:1;min-width:180px}
.note .i{margin-top:1px}
.note-info{background:var(--primary-soft);color:var(--text)}
.note-info>.i{color:var(--primary-ink)}
.note-warn{background:var(--warning-soft);color:var(--text)}
.note-warn>.i{color:var(--warning)}
.note-ok{background:var(--success-soft);color:var(--text)}
.note-ok>.i{color:var(--success)}
.note-err{background:var(--danger-soft);color:var(--text)}
.note-err>.i{color:var(--danger)}
.note b{font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 16px;color:var(--muted)}
.empty .i{width:36px;height:36px;color:var(--subtle);stroke-width:1.5}
.empty h3,.empty h2{color:var(--text);font-size:17px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:24px;min-height:300px;padding:28px 32px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);margin-bottom:18px;overflow:hidden}
.hero-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero h1{font-size:32px;line-height:1.22;letter-spacing:-.01em}
.hero-in>p{color:var(--muted);font-size:16px}
.hero-search{position:relative;display:flex;gap:8px;max-width:560px;margin-top:4px}
.hero-search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
.hero-search input{flex:1;min-width:0;height:46px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-pill);padding:0 16px 0 42px;font-size:15px}
.hero-search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.hero-search .btn{height:46px;border-radius:var(--r-pill);padding:0 20px}
.hero-cta{display:flex;gap:8px;flex-wrap:wrap}
.hero-pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.hp{position:relative;display:block;aspect-ratio:4/5;border-radius:var(--r-md);overflow:hidden;background:var(--photo-bg);border:1px solid var(--border)}
.hp img,.hp .art-svg{width:100%;height:100%;object-fit:cover;display:block}
.hp1{margin-top:22px}
.hp-price{position:absolute;left:8px;bottom:8px;background:var(--surface);color:var(--text);font-weight:700;font-size:13px;padding:2px 8px;border-radius:var(--r-pill);box-shadow:var(--shadow-soft);font-variant-numeric:tabular-nums}
.cats{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 40px 4px 2px;margin:0 -2px 30px;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat-pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);font-size:14.5px;font-weight:500;white-space:nowrap;flex:none;scroll-snap-align:start;color:var(--text)}
.cat-pill .i{color:var(--muted)}
.cat-pill:hover{border-color:var(--primary);color:var(--primary-ink)}
.cat-pill:hover .i{color:var(--primary-ink)}
@container content (min-width:900px){.cats{-webkit-mask-image:none;mask-image:none;padding-right:2px;flex-wrap:wrap;overflow:visible}}
.sec{margin-bottom:36px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:21px}
.sec-h .sec-link{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--primary)}
.sec-h .sec-link:hover{text-decoration:underline}
.sec-sub{font-size:13.5px;color:var(--subtle);margin:-4px 0 14px}
.ad-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:1px 8px}

/* ---------- listing cards: photo first ---------- */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
@container content (min-width:600px){.lgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}}
@container content (min-width:860px){.lgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container content (min-width:1120px){.lgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.lgrid.dense .lc-img{opacity:.85}
.lgrid.one{grid-template-columns:minmax(0,220px)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(156px,176px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:8px}
.rail>*{scroll-snap-align:start}
@container content (min-width:1120px){.rail{grid-auto-flow:row;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-columns:auto;overflow:visible}.rail>:nth-child(n+11){display:none}.rail-6{grid-template-columns:repeat(auto-fit,minmax(calc((100% - 70px) / 6),1fr))}}
.lcard{display:flex;flex-direction:column;min-width:0}
.lc-link{display:flex;flex-direction:column;gap:8px;color:inherit;border-radius:var(--r-md)}
.lc-img{position:relative;aspect-ratio:4/5;border-radius:var(--r-md);overflow:hidden;background:var(--photo-bg)}
.lc-img img,.lc-img .art-svg,.art-svg{width:100%;height:100%;object-fit:cover;display:block}
.lc-link:hover .lc-title{text-decoration:underline;text-underline-offset:3px}
.lc-badge{position:absolute;left:8px;bottom:8px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);box-shadow:var(--shadow-soft)}
.lc-badge.sale{color:var(--sale)}
.lc-sold{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--inverse);color:var(--on-inverse);font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:var(--r-pill);letter-spacing:.02em}
.lc-sold.big{font-size:15px;padding:6px 16px}
.is-paused .lc-img>img,.is-paused .lc-img>.art-svg,.is-sold .lc-img>img,.is-sold .lc-img>.art-svg,.is-reserved .lc-img>img,.is-reserved .lc-img>.art-svg{filter:grayscale(.85);opacity:.6}
.lc-body{display:flex;flex-direction:column;gap:1px;padding:0 2px;min-width:0}
.lc-title{font-family:var(--font-body);font-size:14px;font-weight:500;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-price{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.lc-price strong{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums}
.lc-price strong.sale{color:var(--sale)}
.lc-price s{font-size:12.5px;color:var(--subtle)}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#121826;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-soft);z-index:2}
.heart .i{width:18px;height:18px}
.heart:hover{background:#fff}
.heart[aria-pressed="true"]{color:#121826}
.heart.lg{position:static;width:40px;height:40px;background:var(--surface-2);color:var(--ink);box-shadow:none;flex:none}
.heart.lg[aria-pressed="true"],.heart.bar[aria-pressed="true"]{color:var(--ink)}
.heart.bar{position:static;width:46px;height:46px;flex:none;background:var(--surface-2);color:var(--ink);box-shadow:none;border-radius:var(--r-sm)}
.thumb{width:56px;height:70px;border-radius:var(--r-sm);display:block;flex:none;overflow:hidden;background:var(--photo-bg)}
.thumb img,.thumb .art-svg{width:100%;height:100%;object-fit:cover}
.thumb.lg{width:72px;height:90px}
.thumb.sm{width:40px;height:50px}
.ph-empty{display:grid;place-items:center;width:100%;height:100%;color:var(--subtle)}
.ph-empty .i{width:40%;height:40%;stroke-width:1.2}
.cdots{display:inline-flex;gap:4px;vertical-align:middle}
.cdot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}

/* ---------- browse ---------- */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fb-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 14px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.fb-btn:hover{border-color:var(--muted)}
.fb-btn[data-active="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.fb-btn .i{width:16px;height:16px}
.fb-n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;padding:0 5px}
.fb-wrap{position:relative}
.active-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.more-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px}
.float-fs{display:none}
.fgroup+.fgroup{margin-top:14px}
.fg-l{font-size:12.5px;font-weight:600;color:var(--subtle);margin-bottom:8px;letter-spacing:.02em}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.sw{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);border:1px solid transparent;background:none;cursor:pointer;font-size:13.5px;text-align:left;color:var(--text)}
.sw:hover{background:var(--surface-2)}
.sw[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.sw.dim{color:var(--subtle)}
.sw-dot{width:20px;height:20px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
.sw-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsec{padding:14px 0;border-bottom:1px solid var(--border)}
.fsec h3{font-size:15px;margin-bottom:10px}

/* ---------- menus / popovers ---------- */
.menu{position:absolute;z-index:60;min-width:240px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:6px;animation:pop .12s ease-out}
.menu.wide{width:380px}
.menu.w300{width:320px}
.menu.right{right:0}
.menu.left{left:0}
.menu.top{top:calc(100% + 6px)}
.menu.up{bottom:calc(100% + 6px)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;cursor:pointer;font-size:14px;text-align:left;color:var(--text)}
.menu-item:hover,.menu-item:focus-visible{background:var(--surface-2)}
.menu-item .i{color:var(--muted)}
.menu-item.danger,.menu-item.danger .i{color:var(--danger)}
.menu-item[aria-checked="true"],.menu-item[aria-checked="true"] .i{font-weight:600;color:var(--primary-ink)}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.menu-h{padding:8px 10px 6px;font-size:12px;font-weight:600;color:var(--subtle);letter-spacing:.06em;text-transform:uppercase}
.menu-me{display:flex;align-items:center;gap:12px;padding:6px 4px 14px}
.pop{padding:10px}
.pop-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding:10px 4px 2px;border-top:1px solid var(--border)}
.opt-list{display:flex;flex-direction:column;gap:2px;max-height:360px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;border:0;background:none;text-align:left;width:100%;color:var(--text)}
.opt:hover{background:var(--surface-2)}
.opt .i{color:var(--muted)}
.opt-n{font-size:12px;color:var(--subtle);font-weight:500;margin-left:6px}
.opt-sub{display:block;font-size:12.5px;color:var(--subtle);font-weight:400;line-height:1.4}
.opt-dot,.opt-box{width:16px;height:16px;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
.opt-dot{border-radius:50%}
.opt-box{border-radius:4px}
.opt[aria-checked="true"] .opt-dot,.opt[aria-checked="true"] .opt-box{border-color:var(--primary)}
.opt[aria-checked="true"] .opt-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.opt[aria-checked="true"] .opt-box{background:var(--primary)}
.opt[aria-checked="true"] .opt-box::after{content:"";width:4px;height:8px;border:solid var(--on-primary);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt[aria-checked="true"]{font-weight:600}
.opt.child{padding-left:32px;font-size:13.5px;color:var(--muted)}
.notif{width:380px;max-width:calc(100vw - 24px);padding:0}
.notif-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.notif-h h2{font-size:15px}
.notif-list{max-height:420px;overflow:auto}
.notif-item{display:flex;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-bottom:1px solid var(--border)}
.notif-item:hover{background:var(--surface-2)}
.notif-item .n-ic{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);overflow:hidden}
.notif-item .n-ic .thumb{width:40px;height:40px;border-radius:0}
.notif-item .n-t{font-size:14px;font-weight:600}
.notif-item .n-d{font-size:13px;color:var(--muted);line-height:1.45}
.notif-item .n-time{font-size:12px;color:var(--subtle);margin-top:2px}
.notif-item.unread{background:var(--primary-soft)}
.notif-item.unread .n-t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.notif-f{display:flex;justify-content:space-between;padding:10px 14px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- dialog / sheet / toast ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:90;animation:fade .15s ease-out}
.dialog{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);padding:24px;animation:fade .15s ease-out}
.dialog-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.dialog-h h2{font-size:19px}
.dialog-f{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.star-btn{width:48px;height:48px;color:var(--border-strong)}
.star-btn[data-on="true"]{color:var(--star)}
.sheet{position:fixed;z-index:91;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--border-strong);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-h h2{font-size:18px}
.sheet-f{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);display:flex;gap:8px;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--border)}
.sheet-f .btn{flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
#toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--inverse);color:var(--on-inverse);padding:10px 14px;border-radius:var(--r-md);font-size:14px;font-weight:500;box-shadow:var(--shadow-pop);animation:up .18s ease-out}
.toast .i{width:18px;height:18px}
.toast.ok .i{color:#6FD39F}
.toast.err .i{color:#F59A9A}
.toast a,.toast button{color:inherit;font-weight:700;text-decoration:underline;background:none;border:0;cursor:pointer;padding:0;margin-left:4px}

/* ---------- listing detail ---------- */
.pd{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@container content (min-width:1000px){.pd{gap:40px}}
@container content (min-width:700px){.pd{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}.pd-left{position:sticky;top:calc(var(--top-h) + 20px)}}
.gallery{display:flex;flex-direction:column;gap:10px}
.g-main{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--photo-bg);aspect-ratio:4/5;max-height:calc(100vh - var(--top-h) - 150px);margin:0 auto;width:100%}
@container content (min-width:700px){.g-main{width:auto;max-width:100%}}
.g-frame{width:100%;height:100%}
.g-frame img,.g-frame .art-svg{width:100%;height:100%;object-fit:cover}
.g-kind{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);box-shadow:var(--shadow-soft)}
.g-count{position:absolute;right:12px;top:12px;background:rgba(18,24,38,.66);color:#fff;font-size:12px;font-weight:600;padding:2px 9px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#121826;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-soft)}
.g-nav.prev{left:10px}.g-nav.next{right:10px}
.g-thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding:2px 2px 4px}
.g-thumbs button{flex:none;width:76px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center}
.gt-img{display:block;width:76px;height:95px;border-radius:var(--r-sm);overflow:hidden;background:var(--photo-bg);border:2px solid transparent}
.gt-img img,.gt-img .art-svg{width:100%;height:100%;object-fit:cover}
.g-thumbs button[aria-checked="true"] .gt-img{border-color:var(--primary)}
.gt-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-thumbs button[aria-checked="true"] .gt-l{color:var(--text);font-weight:600}
.g-note{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--subtle)}
.pd-title{display:flex;align-items:flex-start;gap:8px}
.pd-title h1{font-size:25px;flex:1}
.pd-seller{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:14px}
.seller-line{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.seller-line:hover .sl-name{text-decoration:underline}
.sl-meta{color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.pd-price{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.pd-price strong{font-size:30px;font-weight:700;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.pd-price strong.sale{color:var(--sale)}
.pd-price s{color:var(--subtle);font-size:16px}
.pd-listed{font-size:13px;margin-left:auto}
.pd-sec{padding:16px 0;border-top:1px solid var(--border)}
.pd-sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pd-sec-h h2{font-size:15.5px}
.pd-sec-h .seg,.pd-sec-h .btn{margin-left:auto}
.picked{margin-left:auto;font-size:13.5px;color:var(--muted)}
[data-need="1"]>.pd-sec-h h2,[data-need="1"] .lbl{color:var(--danger)}
.size-one{display:inline-grid;place-items:center;min-width:48px;height:40px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--text);font-weight:700;font-size:15px}
.size-chip{flex-direction:column;gap:0;min-height:48px;min-width:64px;border-radius:var(--r-sm);line-height:1.2;font-weight:700}
.cond-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
.cond-pill{display:inline-flex;padding:3px 12px;border-radius:var(--r-pill);font-weight:700;font-size:13.5px;background:var(--surface-3);color:var(--text)}
.cond-pill.c-new,.cond-pill.c-likeNew{background:var(--success-soft);color:var(--success)}
.cond-pill.c-fair{background:var(--warning-soft);color:var(--warning)}
.defect-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.defect-line .i{color:var(--success)}
.defect-line.has{color:var(--text)}
.defect-line.has .i{color:var(--warning)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.facts dt{font-size:12.5px;color:var(--subtle);font-weight:500}
.facts dd{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meas{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;align-items:center}
.meas-fig{width:112px;height:112px;color:var(--muted)}
.meas-fig.sm{width:132px;height:132px}
.meas-svg{width:100%;height:100%}
.meas-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.meas-list div{display:flex;flex-direction:column;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2)}
.meas-list dt{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.meas-list dd{font-size:17px;font-weight:700}
.ml{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:10.5px;font-weight:700;flex:none;font-family:Arial,sans-serif}
.meas-tip{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:12px}
.meas-tip .i{margin-top:2px;flex:none}
.buybox{padding-bottom:0}
.bb-sub{margin-bottom:14px}
.loc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;font-size:14px;text-align:left;min-height:44px;color:var(--text)}
.loc .i{color:var(--muted)}
.loc[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.loc[aria-checked="true"] .i{color:var(--primary-ink)}
.bb-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.need-hint{font-size:13px;color:var(--danger);margin-top:8px;display:flex;gap:6px;align-items:center}
.need-hint .i{width:16px;height:16px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.stepper button:hover{background:var(--surface-2)}
.stepper button[disabled]{opacity:.4;cursor:not-allowed}
.stepper output{min-width:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.sm button{width:32px;height:32px}
.stepper.sm output{min-width:32px;font-size:14px}
.pd-below{margin-top:40px;display:grid;gap:24px}
@container content (min-width:900px){.pd-below{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}}
.pd-below h2{font-size:18px;margin-bottom:10px}
.desc{white-space:pre-line;color:var(--text);max-width:68ch}
.seller-card{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.seller-card .sc-name{font-size:17px;margin:0}
.seller-card .sc-name a:hover{text-decoration:underline}
.sc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;color:var(--muted);align-items:center;margin-top:2px}
.review{padding:12px 0;border-top:1px solid var(--border)}
.review .r-h{display:flex;align-items:center;gap:8px}
.review .r-name{font-weight:600;font-size:14px}
.review .r-stars{display:flex;gap:1px;color:var(--star)}
.review .r-stars .i{width:13px;height:13px}
.review .r-stars .off{color:var(--border-strong)}
.review p{margin-top:6px;font-size:14px}
.buybar{display:none}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--danger)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- closet page ---------- */
.closet-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;padding:4px 0 22px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.closet-head h1,.profile-head h1{font-size:26px}
.ch-main{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.ch-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px}
.cl-cats{margin-bottom:18px}

/* ---------- cart / checkout ---------- */
.two-col{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@container content (min-width:760px){.two-col{grid-template-columns:minmax(0,1fr) 320px}.sticky-side{position:sticky;top:calc(var(--top-h) + 20px)}}
.shop-group .sg-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600}
.shop-group .sg-h .i{color:var(--muted)}
.shop-group .sg-h a:hover{text-decoration:underline}
.citem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px;align-items:start}
.citem+.citem{border-top:1px solid var(--border)}
.citem.gone .thumb{opacity:.45;filter:grayscale(1)}
.ci-title{font-weight:600;font-size:14.5px}
.ci-title:hover{text-decoration:underline}
.ci-meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-top:2px}
.ci-meta span{display:flex;align-items:center;gap:6px}
.ci-meta .i{width:14px;height:14px}
.ci-cp{margin-top:10px;max-width:280px}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ci-price{font-weight:700;font-variant-numeric:tabular-nums}
.pay-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--primary);border-radius:var(--r-md);background:var(--primary-soft)}
.pay-opt .po-ic{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface);color:var(--primary-ink)}
.pay-opt .po-t{font-weight:600}
.pay-opt .po-s{font-size:13px;color:var(--muted)}
.radio-dot{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center}
[aria-checked="true"]>.radio-dot{border-color:var(--primary)}
[aria-checked="true"]>.radio-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.fake-qr{width:200px;height:200px;border-radius:var(--r-sm);background:#fff;padding:10px;border:1px solid var(--border)}
.fake-qr svg{width:100%;height:100%}

/* ---------- orders ---------- */
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px}
.oc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.oc-title{font-weight:600;font-size:15px}
.oc-title:hover{text-decoration:underline}
.oc-sub{font-size:13px;color:var(--muted)}
.oc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted);margin-top:6px}
.oc-meta span{display:inline-flex;gap:6px;align-items:center}
.oc-meta .i{width:15px;height:15px}
.oc-price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tracker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:20px}
.tk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;font-size:13px;color:var(--subtle)}
.tk::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--border)}
.tk:first-child::before{display:none}
.tk .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--subtle);position:relative;z-index:1}
.tk .dot .i{width:15px;height:15px;stroke-width:2.2}
.tk.done{color:var(--text)}
.tk.done .dot{background:var(--success);color:#fff}
.tk.done::before,.tk.now::before{background:var(--success)}
.tk.now{color:var(--primary-ink);font-weight:600}
.tk.now .dot{background:var(--primary);color:var(--on-primary)}
.action-card{padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:var(--primary);background:var(--primary-soft)}
.action-card.tone-danger{border-color:var(--danger);background:var(--danger-soft)}
.action-card.tone-success{border-color:var(--success);background:var(--success-soft)}
.action-card .ac-ic{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--surface);color:var(--primary-ink);flex:none}
.action-card .ac-t{font-weight:600;font-size:15.5px}
.action-card .ac-d{font-size:13.5px;color:var(--muted)}
.action-card .ac-btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pickup-card{display:flex;flex-direction:column}
.pu-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pu-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2)}
.pu-row>.i{color:var(--primary-ink);margin-top:2px}
.pu-l{font-size:12.5px;color:var(--subtle)}
.pu-v{font-weight:600;font-size:15px}
.scan-wrap{max-width:560px;margin:0 auto}
.steps-mini{display:flex;gap:6px;margin-bottom:16px}
.steps-mini span{flex:1;height:4px;border-radius:4px;background:var(--surface-3)}
.steps-mini span.on{background:var(--primary)}
.cam{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:#0B1119;display:grid;place-items:center}
.cam .frame{width:62%;aspect-ratio:1/1;position:relative}
.cam .frame::before{content:"";position:absolute;inset:0;border:3px solid rgba(255,255,255,.9);border-radius:14px;clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.cam .line{position:absolute;left:8%;right:8%;height:2px;background:#7DB9F7;box-shadow:0 0 12px #7DB9F7;top:50%;animation:scan 2.2s ease-in-out infinite alternate}
.cam .cam-note{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;color:#C7D3E3;font-size:12.5px}
@keyframes scan{from{top:16%}to{top:84%}}
.uid{font-family:var(--font-mono);font-size:26px;font-weight:500;letter-spacing:.14em;text-align:center}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center}

/* ---------- wallet ---------- */
.bal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px;align-items:start}
.bal,.money-main{padding:20px;display:flex;flex-direction:column;gap:14px}
.b-l{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.b-v{font-family:var(--font-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.b-s{font-size:13px;color:var(--subtle)}
.b-act{display:flex;gap:8px;flex-wrap:wrap}
.bal.primary-bal{border-color:var(--border-strong)}
.panel{padding:20px;margin-bottom:20px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-h h2{font-size:18px}
.nsteps{display:flex;flex-direction:column;gap:18px;counter-reset:ns}
.nstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.nstep::before{counter-increment:ns;content:counter(ns);width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);font-weight:700;display:grid;place-items:center;font-size:13.5px}
.nstep h3{font-size:15px;margin-bottom:6px}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm);margin-top:6px}
.acct .a-l{font-size:12.5px;color:var(--subtle)}
.acct .a-v{font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px;border:1.5px dashed var(--border-strong);border-radius:var(--r-md);text-align:center;cursor:pointer;color:var(--muted);background:var(--surface-2)}
.drop:hover,.drop:focus-within{border-color:var(--primary);color:var(--primary-ink)}
.drop .i{width:28px;height:28px}
.drop img{max-height:180px;border-radius:var(--r-sm)}
.txtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.txtools .input{max-width:260px;height:38px}
.txday{padding:10px 20px 6px;font-size:12.5px;font-weight:600;color:var(--subtle);letter-spacing:.04em;background:var(--surface-2);border-top:1px solid var(--border)}
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px;width:100%;border:0;background:none;text-align:left;cursor:pointer;border-top:1px solid var(--border)}
.txday+.tx{border-top:0}
.tx:hover{background:var(--surface-2)}
.tx .tx-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.tx .tx-ic.in{background:var(--success-soft);color:var(--success)}
.tx .tx-ic .i{width:18px;height:18px}
.tx .tx-t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tx-s{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tx .tx-a{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tx .tx-a.in{color:var(--success)}
.tx-detail{padding:4px 20px 16px 68px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px;font-size:13.5px}
.tx-detail .l{font-size:12px;color:var(--subtle)}
.cpn{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.cpn .c-val{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--primary-ink);min-width:62px}

/* ---------- my closet ---------- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
@container content (min-width:960px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat,.mstat{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.s-l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.s-l .i{width:16px;height:16px}
.s-v{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.s-f{font-size:12.5px;color:var(--subtle);line-height:1.45}
.s-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
a.s-link{font-size:13px;font-weight:600;color:var(--primary);margin-top:auto}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@container content (min-width:960px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px}
.srow+.srow{border-top:1px solid var(--border)}
.srow .sr-t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sr-s{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srow .sr-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--subtle);padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:var(--surface-2)}
.tbl .p-cell{display:flex;align-items:center;gap:12px;min-width:240px}
.tbl .p-cell .t{font-weight:600}
.tbl .p-cell .t:hover{text-decoration:underline}
.warn-txt{color:var(--warning);font-weight:600}
.money-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@container content (min-width:900px){.money-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.money-main{border-color:var(--primary);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.money-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.formula-box{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.formula{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.formula code{font-family:var(--font-body);font-size:13px;background:var(--surface-2);border:1px solid var(--border);padding:3px 10px;border-radius:6px;color:var(--text)}
.bars{height:var(--h);display:flex;align-items:flex-end;gap:12px;padding:0 8px;border-bottom:1px solid var(--border-strong);background:linear-gradient(var(--border) 1px,transparent 1px) 0 0/100% 50%}
.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bar-col .bv{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.bar-col .bar{width:min(60%,56px);background:var(--primary);border-radius:6px 6px 0 0;min-height:2px;opacity:.55}
.bar-col .bar.cur{opacity:1}
.bar-labels{display:flex;gap:12px;padding:6px 8px 0}
.bar-labels span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-labels span.cur{color:var(--text);font-weight:600}

/* ---------- sell ---------- */
.sell-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@container content (min-width:1000px){.sell-grid{grid-template-columns:minmax(0,1fr) 260px}}
.sell-side{display:none}
@container content (min-width:1000px){.sell-side{display:block}}
.form-sec{padding:20px}
.form-sec h2{font-size:16px;margin-bottom:14px}
.form-sec[data-need="1"]{border-color:var(--danger)}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.pslot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/5;border-radius:var(--r-md);border:1.5px dashed var(--border-strong);background:var(--surface-2);color:var(--muted);cursor:pointer;text-align:center;padding:6px;overflow:hidden}
.pslot:hover,.pslot:focus-within{border-color:var(--primary);color:var(--primary-ink)}
.pslot.hot{border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}
.pslot.filled{border-style:solid;border-color:var(--border);padding:0;cursor:default;background:var(--photo-bg)}
.ps-img{position:absolute;inset:0}
.ps-img img,.ps-img .art-svg{width:100%;height:100%;object-fit:cover}
.pslot.filled .ps-l{position:absolute;left:6px;bottom:6px;background:var(--surface);color:var(--text);font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:var(--r-pill)}
.ps-l{font-size:12.5px;font-weight:600}
.ps-plus .i{width:24px;height:24px}
.ps-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(18,24,38,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.qty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.qty-cell{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.cond-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cond-card{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
.cond-card:hover{border-color:var(--muted)}
.cond-card[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.cc-t{font-weight:700;font-size:14.5px}
.cc-d{font-size:12.5px;color:var(--muted);line-height:1.45}
.meas-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.fs{border:0;padding:0;margin:0}
.fs legend{padding:0;margin-bottom:8px}

/* ---------- profile / settings ---------- */
.profile-head{display:flex;align-items:center;gap:18px;padding:22px;margin-bottom:18px;flex-wrap:wrap}
.prof-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@container content (min-width:860px){.prof-grid{grid-template-columns:1fr 1fr}}
.prof-sec h2{font-size:16px;margin-bottom:8px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--border);color:var(--text)}
.prow:first-of-type{border-top:0}
.prow>.i:first-child,.prow>svg:first-child{color:var(--muted)}
.prow:hover .pr-t{text-decoration:underline}
.pr-t{flex:1;font-weight:600;font-size:14.5px}
.pr-v{font-size:13.5px;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@container content (min-width:720px){.set-grid{grid-template-columns:200px minmax(0,1fr)}.set-nav{position:sticky;top:calc(var(--top-h) + 20px)}}
.set-nav{display:flex;flex-direction:column;gap:2px}

จสอบสินค้าให้เรียบร้อยก่อนทำการสแกนยืนยันรับสินค้า<br>• ตรวจสอบสภาพสินค้า ว่าไม่ชำรุดหรือเสียหาย<br>• ตรวจสอบให้แน่ใจว่าสินค้าตรงตามที่ผู้ขายระบุไว้ในประกาศ/โพสต์","• Please verify the item completely before scanning to confirm receipt.<br>• Check the condition of the item for any damage or defects.<br>• Ensure the item matches the description in the seller&#39;s post."],"img":[]},{"t":["หากสแกนแล้ว ระบบจะถือว่าท่าน “รับสินค้าเรียบร้อยแล้ว”","Once scanned, the system considers the item as 'Received'."],"d":["เมื่อท่านสแกนยืนยันรับสินค้าแล้ว หากภายหลังเกิดปัญหาเกี่ยวกับสินค้า ขอเรียนว่า ระบบ/แพลตฟอร์มทำหน้าที่เป็นเพียงตัวกลางในการซื้อ–ขายเท่านั้น และไม่รับผิดชอบต่อความเสียหายหรือข้อพิพาทระหว่างผู้ซื้อและผู้ขาย","Once you scan to confirm receipt, if issues arise later regarding the product, please note that the system/platform acts only as a trading intermediary and is not responsible for damages or disputes between the buyer and seller."],"img":[]}]},"terms":{"title":["ข้อกำหนดและความเป็นส่วนตัว","Terms & privacy"],"prose":true,"steps":[{"t":["บทนำและขอบเขต","Introduction and Scope"],"d":["ยินดีต้อนรับสู่นโยบายความเป็นส่วนตัวฉบับนี้ของ UNIXA เราให้ความสำคัญกับความเป็นส่วนตัวและการคุ้มครองข้อมูลส่วนบุคคลของผู้ใช้งานทุกท่าน นโยบายนี้อธิบายวิธีที่ UNIXA ทำการเก็บรวบรวม ใช้ เปิดเผย โอนย้าย และดูแลรักษาข้อมูลส่วนบุคคลของคุณ ตลอดจนสิทธิของคุณที่เกี่ยวข้องกับข้อมูลดังกล่าว นโยบายนี้เป็นไปตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) และกฎหมายอื่นที่เกี่ยวข้องของประเทศไทย การใช้บริการของ UNIXA หมายความว่าคุณได้อ่านและยอมรับนโยบายความเป็นส่วนตัวฉบับนี้ หากคุณไม่ยินยอมต่อข้อกำหนดใดๆ ในเอกสารนี้ กรุณาหยุดการใช้บริการของเรา<br>นโยบายนี้ครอบคลุมข้อมูลส่วนบุคคลทุกประเภทที่เราเก็บรวบรวมจากคุณ ไม่ว่าคุณจะใช้บริการผ่านทางเว็บไซต์ แอปพลิเคชัน หรือช่องทางอื่นของ UNIXA เรามุ่งมั่นในการรักษาความโปร่งใสในการประมวลผลข้อมูลและให้คุณสามารถควบคุมข้อมูลส่วนบุคคลของคุณได้อย่างเต็มที่","Welcome to the UNIXA Privacy Policy. We value your privacy and the protection of your personal data. This policy explains how UNIXA collects, uses, discloses, transfers, and safeguards your personal data, as well as your rights in relation to such data.<br>This policy complies with the Personal Data Protection Act B.E. 2562 (PDPA) and other applicable laws of Thailand. By using UNIXA services, you acknowledge that you have read and accepted this Privacy Policy. If you do not agree with any part of this document, please discontinue using our services. This policy covers all types of personal data we collect from you, whether you use our services via website, application, or other channels. We are committed to transparency in data processing and ensuring you have full control over your personal data."],"img":[]},{"t":["การเก็บข้อมูลส่วนบุคคล","Collection of Personal Data"],"d":["เราอาจเก็บรวบรวมข้อมูลส่วนบุคคลของคุณหลายประเภท เพื่อให้บริการของ UNIXA ทำงานได้อย่างมีประสิทธิภาพและตอบสนองความต้องการของคุณ ตัวอย่างประเภทข้อมูลส่วนบุคคลที่เราเก็บรวบรวม ได้แก่:<br>• <strong>ข้อมูลส่วนตัว:</strong> เช่น ชื่อ-นามสกุล วันเดือนปีเกิด เพศ เลขบัตรประชาชน หนังสือเดินทาง หรือสำเนาเอกสารระบุตัวตน<br>• <strong>ข้อมูลการติดต่อ:</strong> เช่น อีเมล หมายเลขโทรศัพท์ ที่อยู่ทางไปรษณีย์ หรือที่อยู่สำหรับจัดส่งสินค้า<br>• <strong>ข้อมูลบัญชีผู้ใช้:</strong> เช่น ชื่อผู้ใช้ รหัสผ่าน (เข้ารหัส) ประวัติการใช้งานบัญชี<br>• <strong>ข้อมูลธุรกรรมทางการเงิน:</strong> เช่น ข้อมูลบัญชีธนาคาร รายละเอียดบัตรเครดิต/เดบิต (เข้ารหัส) ประวัติการทำธุรกรรมและการชำระเงิน<br>• <strong>ข้อมูลการใช้งาน:</strong> เช่น IP address ประเภทเบราว์เซอร์ อุปกรณ์ ระบบปฏิบัติการ เวลาที่เข้าใช้บริการ พฤติกรรมการใช้งาน (เช่น หน้าที่เข้าชม บริการที่ใช้ ความถี่ในการใช้งาน)<br>• <strong>ข้อมูลจากบุคคลที่สาม:</strong> เช่น ข้อมูลจากบริการโซเชียลมีเดีย (หากคุณเชื่อมต่อบัญชีของคุณกับบริการอื่น) ข้อมูลเครดิตจากผู้ให้บริการชำระเงิน หรือข้อมูลสาธารณะที่ได้รับอนุญาตตามกฎหมาย<br>เราจะเก็บรวบรวมข้อมูลส่วนบุคคลของคุณเท่าที่จำเป็นสำหรับวัตถุประสงค์ที่ได้แจ้งให้ทราบเท่านั้น ข้อมูลส่วนบุคคลส่วนใหญ่ที่เราได้มาจะเป็นข้อมูลที่คุณให้กับเราโดยตรง (เช่น เมื่อสมัครสมาชิก หรือกรอกแบบฟอร์มต่างๆ) นอกจากนี้ เราอาจได้รับข้อมูลของคุณโดยอัตโนมัติผ่านคุกกี้และเทคโนโลยีติดตาม (ดูหัวข้อคุกกี้ด้านล่าง) หรือจากบุคคลที่สามที่เราได้รับข้อมูลมาอย่างถูกต้องตามกฎหมาย","We may collect various types of personal data to provide and improve our services. Examples include:<br>• <strong>Personal Information:</strong> such as full name, date of birth, gender, ID number, passport, or identity documents<br>• <strong>Contact Information:</strong> such as email, phone number, postal address, or delivery address<br>• <strong>Account Information:</strong> such as username, password (encrypted), and account activity history<br>• <strong>Financial Information:</strong> such as bank account details, credit/debit card information (encrypted), transaction history<br>• <strong>Usage Data:</strong> such as IP address, browser type, device, operating system, access time, and usage behavior<br>• <strong>Third-party Data:</strong> such as data from social media (if linked), payment providers, or publicly available data<br>We collect only necessary data for specified purposes. Most data is provided directly by you, while some may be collected automatically via cookies or from lawful third-party sources."],"img":[]},{"t":["การใช้งานข้อมูลส่วนบุคคล","Use of Personal Data"],"d":["UNIXA ใช้ข้อมูลส่วนบุคคลของคุณเพื่อวัตถุประสงค์ที่ชอบด้วยกฎหมายและเพื่อปรับปรุงประสบการณ์การใช้งานของคุณ วัตถุประสงค์หลักในการประมวลผลข้อมูลของเรา ได้แก่:<br>• <strong>เพื่อให้บริการและดำเนินการตามคำขอ:</strong> เราใช้ข้อมูลของคุณในการสร้างและจัดการบัญชีผู้ใช้ ยืนยันตัวตนของคุณ และให้คุณเข้าถึงฟีเจอร์และบริการต่างๆ ของแพลตฟอร์ม รวมถึงการดำเนินการธุรกรรมที่คุณร้องขอ<br>• <strong>เพื่อปรับปรุงและพัฒนาบริการ:</strong> ข้อมูลการใช้งานและคำติชมของคุณถูกนำไปใช้ในการวิเคราะห์และวิจัย เพื่อปรับปรุงคุณภาพของบริการ พัฒนาฟีเจอร์ใหม่ๆ และปรับประสบการณ์ผู้ใช้ให้ตรงกับความต้องการมากขึ้น<br>• <strong>เพื่อสื่อสารและการตลาด:</strong> อีเมลหรือข้อมูลติดต่อของคุณอาจถูกใช้ในการส่งข่าวสาร แจ้งเตือน หรือข้อเสนอทางการตลาด เช่น โปรโมชั่นพิเศษที่อาจเป็นประโยชน์ต่อคุณ ทั้งนี้เราจะดำเนินการเช่นนี้ต่อเมื่อได้รับความยินยอมจากคุณ หรือเมื่อได้รับอนุญาตตามกฎหมายที่เกี่ยวข้อง คุณสามารถเลือกที่จะยกเลิกการรับข้อมูลการตลาดเหล่านี้ได้ทุกเมื่อ<br>• <strong>เพื่อความปลอดภัยและป้องกันการทุจริต:</strong> เราอาจใช้ข้อมูลบางอย่างเพื่อตรวจสอบกิจกรรมที่น่าสงสัย ป้องกันการฉ้อโกงหรือการละเมิดเงื่อนไขการใช้งาน และเพื่อรักษาความปลอดภัยให้กับผู้ใช้งานและระบบของเรา<br>• <strong>เพื่อปฏิบัติตามกฎหมาย:</strong> ในบางกรณี เราจำเป็นต้องประมวลผลข้อมูลส่วนบุคคลของคุณเพื่อปฏิบัติตามข้อกำหนดทางกฎหมาย หรือคำสั่งของหน่วยงานราชการที่มีอำนาจตามกฎหมาย<br>UNIXA จะไม่ใช้หรือประมวลผลข้อมูลส่วนบุคคลของคุณนอกเหนือจากวัตถุประสงค์ที่ได้แจ้งไว้ เว้นแต่จะได้รับความยินยอมเพิ่มเติมจากคุณ หรือเป็นการดำเนินการที่กฎหมายอนุญาต หากเรามีความจำเป็นต้องใช้ข้อมูลของคุณเพื่อวัตถุประสงค์ใหม่ที่ไม่ครอบคลุมในนโยบายนี้ เราจะแจ้งให้คุณทราบและขอความยินยอมจากคุณก่อนดำเนินการ","We use your personal data for lawful purposes, including:<br>• <strong>Service Provision:</strong> managing accounts, verifying identity, enabling platform features, and processing transactions<br>• <strong>Service Improvement:</strong> analyzing usage data and feedback to improve services and develop new features<br>• <strong>Communication and Marketing:</strong> sending updates, notifications, or promotions (with your consent or as permitted by law)<br>• <strong>Security and Fraud Prevention:</strong> detecting suspicious activity and ensuring platform safety<br>• <strong>Legal Compliance:</strong> complying with applicable laws or lawful requests<br>We will not use your data beyond stated purposes unless we obtain your consent or are permitted by law."],"img":[]},{"t":["การเปิดเผยข้อมูลส่วนบุคคล","Disclosure of Personal Data"],"d":["เราอาจเปิดเผยข้อมูลส่วนบุคคลของคุณในกรณีดังต่อไปนี้:<br>• <strong>ผู้ให้บริการภายนอก (Third-party service providers):</strong> เราอาจแบ่งปันข้อมูลของคุณกับผู้ให้บริการที่เข้ามาดำเนินการแทนเราในบางหน้าที่ เช่น ผู้ให้บริการชำระเงิน ผู้ให้บริการคลาวด์หรือโฮสติ้ง ผู้ให้บริการด้านการวิเคราะห์ข้อมูล ผู้ให้บริการด้านการตลาด หรือผู้ให้บริการขนส่งสินค้า บุคคลที่สามเหล่านี้จะได้รับอนุญาตให้เข้าถึงข้อมูลเท่าที่จำเป็นในการปฏิบัติงานตามที่เรากำหนดเท่านั้น และต้องปฏิบัติตามข้อผูกพันในการรักษาความลับและความปลอดภัยของข้อมูล<br>• <strong>พันธมิตรทางธุรกิจ:</strong> ในบางกรณีเราอาจมีการร่วมมือกับพันธมิตรหรือองค์กรอื่นในการให้บริการ หรือจัดโปรโมชั่นร่วม หากการเปิดเผยข้อมูลของคุณแก่พันธมิตรเป็นสิ่งจำเป็น เราจะแจ้งให้คุณทราบและขอความยินยอมตามที่กฎหมายกำหนด (ยกเว้นในกรณีที่กฎหมายอนุญาตให้เปิดเผยได้โดยไม่ต้องขอความยินยอม)<br>• <strong>การปฏิบัติตามกฎหมาย:</strong> เราอาจจำเป็นต้องเปิดเผยข้อมูลส่วนบุคคลของคุณเพื่อตอบสนองต่อกฎหมาย ข้อบังคับ กระบวนการทางกฎหมาย หรือคำขอจากหน่วยงานภาครัฐที่มีอำนาจตามกฎหมาย เช่น เปิดเผยข้อมูลตามหมายศาล หรือตามคำสั่งของหน่วยงานกำกับดูแล<br>• <strong>การปกป้องสิทธิและทรัพย์สิน:</strong> เราอาจเปิดเผยข้อมูลของคุณหากจำเป็นเพื่อปกป้องสิทธิ ทรัพย์สิน หรือความปลอดภัยของ UNIXA ผู้ใช้งานของเรา หรือบุคคลอื่น ทั้งนี้รวมถึงการเปิดเผยข้อมูลเพื่อวัตถุประสงค์ในการป้องกันหรือจัดการกรณีทุจริต การโจมตีทางไซเบอร์ หรือการละเมิดที่อาจเกิดขึ้น<br>• <strong>การควบรวมกิจการหรือโอนธุรกิจ:</strong> ในกรณีที่ UNIXA มีการปรับโครงสร้างองค์กร มีการควบรวมกิจการ ถูกซื้อกิจการ หรือมีการโอนบางส่วนของธุรกิจ ข้อมูลส่วนบุคคลของผู้ใช้อาจถูกโอนไปยังฝ่ายที่รับช่วงสิทธิ์ในการดำเนินธุรกิจดังกล่าว เราจะพยายามแจ้งให้คุณทราบล่วงหน้าก่อนที่ข้อมูลของคุณจะถูกโอน และหลังการโอนข้อมูล นโยบายความเป็นส่วนตัวฉบับใหม่ (ถ้ามี) จะถูกแจ้งให้คุณทราบ<br>ในทุกกรณีของการแบ่งปันหรือเปิดเผยข้อมูล เราจะดำเนินการตามหลักการของความจำเป็น (Need to know basis) และใช้มาตรการป้องกัน (เช่น ข้อตกลงคุ้มครองข้อมูล หรือ NDA) เพื่อให้มั่นใจว่าบุคคลหรือหน่วยงานที่ได้รับข้อมูลจะคุ้มครองและใช้ข้อมูลของคุณอย่างปลอดภัยและถูกต้องตามที่กำหนด","We may disclose your data in the following cases:<br>• <strong>Third-party Service Providers:</strong> such as payment processors, cloud providers, analytics, marketing, or logistics providers<br>• <strong>Business Partners:</strong> when necessary for joint services or promotions (with consent where required)<br>• <strong>Legal Compliance:</strong> to comply with laws, regulations, or government requests<br>• <strong>Protection of Rights:</strong> to protect rights, property, or safety of UNIXA and others<br>• <strong>Business Transfers:</strong> in cases of mergers, acquisitions, or restructuring<br>All disclosures follow a need-to-know basis and include appropriate safeguards (e.g., data protection agreements)."],"img":[]},{"t":["การเก็บรักษาข้อมูลส่วนบุคคลและความปลอดภัย","Data Retention and Security"],"d":["เราให้ความสำคัญกับการรักษาความปลอดภัยของข้อมูลส่วนบุคคลของคุณและจะเก็บรักษาข้อมูลของคุณไว้ตราบเท่าที่จำเป็นเพื่อบรรลุวัตถุประสงค์ที่ได้แจ้งไว้ หรือตามที่กฎหมายกำหนดเท่านั้น ระยะเวลาในการเก็บรักษาข้อมูลอาจแตกต่างกันไปตามประเภทของข้อมูลและวัตถุประสงค์การใช้งาน ตัวอย่างเช่น:<br>• <strong>ข้อมูลบัญชีผู้ใช้:</strong> เก็บรักษาตลอดช่วงเวลาที่คุณมีบัญชีผู้ใช้งานอยู่กับเรา และอาจเก็บต่อเนื่องอีกระยะหนึ่ง (เช่น 7 ปีหลังปิดบัญชี) เพื่อวัตถุประสงค์ด้านการจัดทำรายงานหรือการปฏิบัติตามข้อกำหนดทางกฎหมาย<br>• <strong>ข้อมูลธุรกรรมทางการเงิน:</strong> เก็บรักษาอย่างน้อย 5 ปี นับจากวันที่ทำธุรกรรม เพื่อปฏิบัติตามข้อกำหนดทางบัญชีและภาษี<br>• <strong>ข้อมูลการตลาด:</strong> เก็บรักษาจนกว่าคุณจะมีการถอนความยินยอมในการรับการตลาด หรือเมื่อข้อมูลนั้นไม่มีความจำเป็นต่อการประมวลผลอีกต่อไป<br>• <strong>บันทึกการเข้าใช้งานระบบ:</strong> เก็บรักษาประมาณ 12 เดือน หรือระยะเวลาที่เหมาะสมตามแนวปฏิบัติด้านความปลอดภัยของระบบ<br>เมื่อพ้นระยะเวลาที่จำเป็นในการเก็บรักษาแล้ว เราจะดำเนินการลบ ทำลาย หรือทำให้ข้อมูลไม่สามารถระบุตัวบุคคลได้อย่างปลอดภัย (เช่น การทำให้เป็นข้อมูลไม่ระบุตัวตนแบบถาวร)","We retain personal data only as long as necessary or as required by law:<br>• <strong>Account data:</strong> during account use + up to 7 years after closure<br>• <strong>Financial data:</strong> at least 5 years<br>• <strong>Marketing data:</strong> until consent is withdrawn<br>• <strong>System logs:</strong> about 12 months<br>After retention, data will be deleted or anonymized."],"img":[]},{"t":["การโอนข้อมูลระหว่างประเทศ","International Data Transfers"],"d":["ข้อมูลส่วนบุคคลของคุณอาจถูกจัดเก็บหรือประมวลผลในเซิร์ฟเวอร์ที่ตั้งอยู่นอกประเทศไทย หากเรามีความจำเป็นต้องโอนข้อมูลส่วนบุคคลของคุณไปยังประเทศอื่น (เช่น การใช้บริการคลาวด์ระหว่างประเทศ หรือการประมวลผลโดยบริษัทแม่/บริษัทในเครือต่างประเทศ) เราจะดำเนินการตามมาตรการที่กฎหมายกำหนดเพื่อให้มั่นใจว่าการโอนข้อมูลดังกล่าวมีการคุ้มครองอย่างเพียงพอ<br>เราจะดำเนินการตรวจสอบว่าประเทศปลายทางหรือองค์กรปลายทางที่รับข้อมูลของคุณนั้นมีมาตรฐานการคุ้มครองข้อมูลส่วนบุคคลที่เพียงพอเทียบเท่ากับมาตรฐานที่กำหนดในประเทศไทย หากจำเป็น เราจะทำสัญญาการโอนข้อมูลส่วนบุคคล (Data Transfer Agreement) กับหน่วยงานรับข้อมูลเพื่อระบุภาระผูกพันในการคุ้มครองข้อมูล และหากกฎหมายกำหนด เราจะขอความยินยอมจากคุณก่อนการโอนข้อมูล","Your data may be stored or processed outside Thailand.<br>We ensure adequate protection standards and may implement data transfer agreements. Consent will be obtained where required by law."],"img":[]},{"t":["สิทธิของเจ้าของข้อมูลส่วนบุคคล","Data Subject Rights"],"d":["ภายใต้ PDPA คุณในฐานะเจ้าของข้อมูลส่วนบุคคลมีสิทธิหลายประการเกี่ยวกับข้อมูลของคุณ ซึ่งเราขอยืนยันว่าจะเคารพและอำนวยความสะดวกในการใช้สิทธิเหล่านี้อย่างเต็มที่ สิทธิของคุณประกอบด้วย:<br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>หากคุณต้องการใช้สิทธิใดๆ ข้างต้น คุณสามารถติดต่อเราตามช่องทางที่ระบุในหัวข้อการติดต่อด้านล่าง เราจะดำเนินการตามคำร้องของคุณโดยไม่ล่าช้าและภายในระยะเวลาที่กฎหมายกำหนด (โดยทั่วไปภายใน 30 วัน) ทั้งนี้ อาจมีบางกรณีที่เราสามารถปฏิเสธคำร้องของคุณได้ตามที่กฎหมายอนุญาต (เช่น กรณีที่ต้องปฏิบัติตามกฎหมายหรือคำสั่งศาล) ซึ่งเราจะแจ้งเหตุผลให้คุณทราบ","Under PDPA, you have the following rights:<br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong></strong> <br>• <strong   const no = '08' + String(h).padStart(8, '0'), sh = S.sellers[sid];
  return { no, fmt:no.slice(0, 3) + '-' + no.slice(3, 6) + '-' + no.slice(6), name:L(sh.full || sh.name) };
}

/* ============================== router ============================== */
const PROTECTED = new Set(['orders','scan','mycloset','sell','apply','profile','settings','saved']);
function parse(h){
  h = (h || '').replace(/^#/, '');
  try { h = decodeURIComponent(h); } catch(e){}
  if (!/^[A-Za-z0-9._~-]*$/.test(h)) h = '';
  const i = h.indexOf('.');
  return i < 0 ? { name: h || 'home', arg:'' } : { name: h.slice(0, i), arg: h.slice(i + 1) };
}
const tok = r => r.arg ? r.name + '.' + r.arg : r.name;
function go(token, opts){
  opts = opts || {};
  const r = parse(token); const same = tok(r) === tok(S.route);
  S.route = r; closeOverlays(true); if (!isWide()) S.nav = false; enter(r);
  if (!same) { try { history.pushState(null, '', '#' + tok(r)); } catch(e){} }
  render();
  const secEl = r.name === 'settings' && r.arg && document.getElementById('set-' + r.arg);
  if (secEl) secEl.scrollIntoView({ block:'start' });
  else if (!same || opts.top) window.scrollTo(0, 0);
  if (opts.focus !== false) focusMain();
}
function enter(r){
  if (r.name === 'browse') {
    if (r.arg === 'featured') S.f = Object.assign(defaultFilters(), { feed:'featured' });
    else if (r.arg === 'new') S.f = Object.assign(defaultFilters(), { sort:'time' });
    else if (r.arg.startsWith('c-')) S.f = Object.assign(defaultFilters(), { cat: r.arg.slice(2) });
    else if (r.arg !== 'search' && r.arg !== 'keep') S.f = defaultFilters();
  }
  if (r.name === 'item' && (!S.pd || S.pd.id !== r.arg)) S.pd = { id:r.arg, photo:0, sizeId:null, day:null, slot:null, loc:null, qty:1, tried:false };
  if (r.name === 'scan') S.scan = { step:1, checked:false, manual:false, err:null };
  if (r.name === 'sell' && !S.sellForm) S.sellForm = freshSellForm();
  if (r.name === 'closet') S.clCat = '';
}
window.addEventListener('popstate', () => { S.route = parse(location.hash); closeOverlays(true); if (!isWide()) S.nav = false; enter(S.route); render(); window.scrollTo(0, 0); });
function focusMain(){ requestAnimationFrame(() => { const h = document.getElementById('page-title') || document.getElementById('main'); if (h) h.focus({ preventScroll:true }); }); }

/* ============================== render ============================== */
function render(){
  const app = document.getElementById('app');
  const act = document.activeElement;
  const actId = act && act.id; const selStart = act && act.selectionStart;
  const kept = {};
  document.querySelectorAll('[data-keep]').forEach(el => { if (el.dataset.keep === 'always' || el === act) kept[el.id] = el.value; });
  const forms = snapForms();
  app.className = 'r-' + S.route.name + (S.route.name === 'item' ? ' is-item' : '') + (S.navStyle === 'drawer' ? ' nav-drawer' : ' nav-top');
  app.innerHTML = vApp();
  for (const id in kept) { const el = document.getElementById(id); if (el && !S.ui.clearKeep) el.value = kept[id]; }
  restoreForms(forms);
  S.ui.clearKeep = false;
  document.documentElement.lang = S.lang;
  if (S.ui.focus) { const el = document.querySelector(S.ui.focus); S.ui.focus = null; if (el) el.focus(); }
  else if (actId) { const el = document.getElementById(actId); if (el) { el.focus({ preventScroll:true }); if (selStart != null && el.setSelectionRange) try { el.setSelectionRange(selStart, selStart); } catch(e){} } }
  const msgs = document.getElementById('chat-msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
  qrTick(); heroWatch();
}
const fkey = el => el.name + '|' + ((el.type === 'checkbox' || el.type === 'radio') ? el.value : el.id);
function snapForms(){ const out = []; document.querySelectorAll('form[data-persist]').forEach(f => { const m = {}; f.querySelectorAll('input,select,textarea').forEach(el => { if (el.type === 'file' || !el.name) return; m[fkey(el)] = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value; }); out.push([f.dataset.form, m]); }); return out; }
function restoreForms(snap){ if (S.ui.clearKeep) return; snap.forEach(([name, m]) => { const f = document.querySelector('form[data-form="' + name + '"]'); if (!f) return; f.querySelectorAll('input,select,textarea').forEach(el => { const k = fkey(el); if (!(k in m)) return; if (el.type === 'checkbox' || el.type === 'radio') el.checked = m[k]; else el.value = m[k]; }); }); }
const patch = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

function applyTheme(){
  const root = document.documentElement;
  if (S.themePref === 'system') { if (HOST_THEME) root.setAttribute('data-theme', HOST_THEME); else root.removeAttribute('data-theme'); }
  else root.setAttribute('data-theme', S.themePref);
}
function isDark(){ const a = document.documentElement.getAttribute('data-theme'); if (a) return a === 'dark'; return matchMedia('(prefers-color-scheme: dark)').matches; }

function toast(msg, kind, action){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.innerHTML = ic(kind === 'err' ? 'circle-alert' : 'circle-check') + '<span>' + esc(msg) + '</span>' + (action ? '<a href="#' + action.go + '" data-go="' + action.go + '">' + esc(action.label) + '</a>' : '');
  box.appendChild(el);
  setTimeout(() => el.remove(), action ? 5200 : 3400);
}

/* hide the top-bar search on Home while the hero search is on screen */
let heroObs = null;
function heroWatch(){
  if (heroObs) { heroObs.disconnect(); heroObs = null; }
  const tb = document.querySelector('.topbar'); if (!tb) return;
  const hs = document.getElementById('hero-search');
  if (!hs || !('IntersectionObserver' in window)) { tb.classList.remove('hide-search'); return; }
  tb.classList.add('hide-search');
  heroObs = new IntersectionObserver(es => { es.forEach(e => tb.classList.toggle('hide-search', e.isIntersecting)); }, { rootMargin:'-64px 0px 0px 0px' });
  heroObs.observe(hs);
}
